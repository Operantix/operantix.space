<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0A0F14" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.35" />

  <!-- Subtle grid pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Phone Handset Base -->
  <g transform="translate(136, 136) scale(1.0)" filter="url(#glow)">
    <!-- Dialpad Keypad Grid -->
    <circle cx="60" cy="50" r="14" fill="#34D399" opacity="0.9" />
    <circle cx="120" cy="50" r="14" fill="#34D399" opacity="0.9" />
    <circle cx="180" cy="50" r="14" fill="#34D399" opacity="0.9" />

    <circle cx="60" cy="110" r="14" fill="#34D399" opacity="0.9" />
    <circle cx="120" cy="110" r="14" fill="#34D399" opacity="0.9" />
    <circle cx="180" cy="110" r="14" fill="#34D399" opacity="0.9" />

    <circle cx="60" cy="170" r="14" fill="#34D399" opacity="0.9" />
    <circle cx="120" cy="170" r="14" fill="#34D399" opacity="0.9" />
    <circle cx="180" cy="170" r="14" fill="#34D399" opacity="0.9" />

    <!-- Big Center Call Icon circle -->
    <circle cx="120" cy="230" r="28" fill="url(#emeraldGrad)" />
    <!-- Phone symbol in center call button -->
    <path d="M110 220 C110 216 113 213 117 213 L120 213 C123 213 125 215 125 218 L126 223 C127 225 126 227 124 228 L122 229 C126 235 131 240 137 244 L138 242 C139 240 141 239 143 240 L148 241 C151 241 153 243 153 246 L153 249 C153 253 150 256 146 256 C124 256 110 238 110 220 Z" fill="#FFFFFF" transform="scale(0.85) translate(22, 35)" />
  </g>

  <!-- Security Shield & Padlock Emblem in Corner -->
  <g transform="translate(320, 320) scale(1.15)">
    <!-- Glowing Shield -->
    <path d="M60 10 L105 28 C105 75 75 110 60 120 C45 110 15 75 15 28 Z" fill="url(#shieldGrad)" stroke="#6EE7B7" stroke-width="3" filter="url(#glow)" />
    <!-- Lock Shackle -->
    <path d="M50 56 L50 46 C50 40 54 36 60 36 C66 36 70 40 70 46 L70 56" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="42" y="54" width="36" height="28" rx="6" fill="#FFFFFF" />
    <!-- Keyhole -->
    <circle cx="60" cy="65" r="3" fill="#047857" />
    <path d="M59 66 L61 66 L62 73 L58 73 Z" fill="#047857" />
  </g>
</svg>
